<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wuool Nerd - Notícias Geek</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Orbitron:wght@400;700&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --cor-principal: #800080;
            --cor-fundo: #f0f2f5;
            --cor-card: #ffffff;
            --cor-texto: #333;
            --cor-borda: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--cor-fundo);
            color: var(--cor-texto);
            line-height: 1.6;
            scroll-behavior: smooth;
            /* Adicionado para um deslize suave ao clicar no link */
        }

        /* Cabeçalho */
        #area-cabecalio {
            background-color: #1a1a1a;
            color: white;
            padding: 15px 40px;
            border-bottom: 4px solid var(--cor-principal);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #area-logo h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2em;
            letter-spacing: 2px;
        }

        .branco {
            color: var(--cor-principal);
        }

        .social-icons-topo {
            display: flex;
            gap: 15px;
        }

        .social-icons-topo a {
            color: white;
            font-size: 20px;
            transition: 0.3s;
        }

        .social-icons-topo a:hover {
            color: var(--cor-principal);
        }

        /* Layout Principal */
        #container {
            max-width: 1300px;
            margin: 20px auto;
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            padding: 0 15px;
        }

        #area-postagens {
            flex: 2.5;
            min-width: 350px;
        }

        /* Estilo da Postagem */
        .postagem {
            background: var(--cor-card);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--cor-borda);
            margin-bottom: 25px;
        }

        .midia-container {
            width: 100%;
            margin: 15px 0;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .midia-container img {
            width: 100%;
            display: block;
        }

        .conteudo-texto {
            white-space: pre-wrap;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: #444;
        }

        .conteudo-texto.aberto {
            display: block;
            -webkit-line-clamp: initial;
        }

        /* Laterais */
        .coluna-lateral {
            flex: 1;
            min-width: 260px;
        }

        .conteudo-lateral {
            background: var(--cor-card);
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid var(--cor-borda);
        }

        .conteudo-lateral h3 {
            background: linear-gradient(90deg, #1a1a1a, var(--cor-principal));
            color: white;
            padding: 12px 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85em;
            text-transform: uppercase;
        }

        .links-destaque {
            padding: 10px;
        }

        .links-destaque a {
            display: block;
            padding: 10px 10px 10px 35px;
            text-decoration: none;
            color: #444;
            font-size: 0.85em;
            border-bottom: 1px solid #f5f5f5;
            position: relative;
            transition: 0.3s;
        }

        .links-destaque a::before {
            content: "\f105";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            left: 12px;
            color: var(--cor-principal);
        }

        .links-destaque a:hover {
            background: #fdf0ff;
            color: var(--cor-principal);
            padding-left: 15px;
        }

        /* Rodapé */
        footer {
            background-color: #1a1a1a;
            color: white;
            padding: 40px 20px 20px;
            margin-top: 50px;
            border-top: 4px solid var(--cor-principal);
        }

        .footer-container {
            max-width: 1300px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .footer-box h4 {
            font-family: 'Orbitron', sans-serif;
            color: var(--cor-principal);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .footer-box p,
        .footer-box li {
            font-size: 0.9em;
            color: #bbb;
        }

        .footer-social {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .footer-social a {
            color: white;
            font-size: 20px;
            transition: 0.3s;
        }

        .footer-social a:hover {
            color: var(--cor-principal);
            transform: scale(1.1);
        }

        .copyright {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #333;
            font-size: 0.8em;
            color: #777;
        }

        @media (max-width: 768px) {
            #area-cabecalio {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            #container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <header id="area-cabecalio">
        <div id="area-logo">
            <h1>WUOOL<span class="branco">NERD</span></h1>
        </div>
        <div class="social-icons-topo">
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-tiktok"></i></a>
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
            <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
        </div>
    </header>

    <main id="container">
        <aside class="coluna-lateral">
            <div class="conteudo-lateral">
                <h3><i class="fa-solid fa-dragon"></i> Animes</h3>
                <div id="feed-animes" class="links-destaque"></div>
            </div>
            <div class="conteudo-lateral">
                <h3><i class="fa-solid fa-tv"></i> Plataformas</h3>
                <div id="feed-plataformas" class="links-destaque"></div>
            </div>
        </aside>

        <section id="area-postagens"></section>

        <aside class="coluna-lateral">
            <div class="conteudo-lateral">
                <h3><i class="fa-solid fa-plus"></i> Nerd</h3>
                <div id="feed-nerd" class="links-destaque"></div>
            </div>
            <div class="conteudo-lateral">
                <h3><i class="fa-solid fa-clock-rotate-left"></i> Antigas</h3>
                <div id="feed-antigas" class="links-destaque"></div>
            </div>
        </aside>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-box">
                <h4>WUOOL<span class="branco">NERD</span></h4>
                <p>O portal definitivo para quem vive a cultura geek. Notícias, reviews e lançamentos em tempo real.</p>
            </div>
            <div class="footer-box">
                <h4>Navegação</h4>
                <ul style="list-style: none;">
                    <li style="margin-bottom: 8px;"><a href="#" style="color: #bbb; text-decoration: none;">Início</a>
                    </li>
                    <li style="margin-bottom: 8px;"><a href="#" style="color: #bbb; text-decoration: none;">Animes</a>
                    </li>
                    <li style="margin-bottom: 8px;"><a href="#" style="color: #bbb; text-decoration: none;">Games</a>
                    </li>
                </ul>
            </div>
            <div class="footer-box">
                <h4>Siga-nos</h4>
                <div class="footer-social">
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#"><i class="fa-brands fa-tiktok"></i></a>
                    <a href="#"><i class="fa-brands fa-youtube"></i></a>
                    <a href="#"><i class="fa-brands fa-discord"></i></a>
                </div>
            </div>
        </div>
        <div class="copyright">
            &copy; 2026 Wuool Nerd - Todos os direitos reservados.
        </div>
    </footer>

    <script>
        // Configuração do Banco (Supabase)
        const { createClient } = supabase;
        const _supabase = createClient("https://xkngtsnzkbmfsugahtsa.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhrbmd0c256a2JtZnN1Z2FodHNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4OTA2MTcsImV4cCI6MjA5MDQ2NjYxN30.zrk4-ckiw50zUdt1JrTD13SlSLNh1Upn5C7nm12jWEA");

        const container = document.getElementById('area-postagens');

        function extrairId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function renderizar() {
            const { data: noticias, error } = await _supabase
                .from('noticias')
                .select('*')
                .order('timestamp', { ascending: false });

            if (error || !noticias || noticias.length === 0) {
                container.innerHTML = "<h2 style='text-align:center; opacity:0.3; margin-top:50px;'>Aguardando publicações...</h2>";
                return;
            }

            noticias.forEach((n) => {
                const post = document.createElement('article');
                post.className = 'postagem';

                // CRIAÇÃO DO ID PARA O DIRECIONAMENTO
                const noticiaID = `news-${n.id}`;
                post.id = noticiaID;

                const vidId = extrairId(n.video);
                let midia = vidId
                    ? `<div class="midia-container"><div class="video-wrapper"><iframe src="https://www.youtube.com/embed/${vidId}" frameborder="0" allowfullscreen></iframe></div></div>`
                    : (n.imagem ? `<div class="midia-container"><img src="${n.imagem}"></div>` : "");

                const dataExibicao = (n.data && n.data !== "null" && n.data !== "") ? n.data : "29/03/2026";
                const autorFinal = (n.autor && n.autor !== "null") ? `@${n.autor.replace('@', '')}` : "@wuoolnerd";

                post.innerHTML = `
                    <h2 style="font-family: ${n.fonte_titulo || 'Roboto'}">${n.titulo}</h2>
                    <small style="color:var(--cor-principal); font-weight:bold;">${n.tema} • ${dataExibicao}</small>
                    ${midia}
                    <div class="conteudo-texto" style="font-family: ${n.fonte_conteudo || 'Roboto'}">${n.conteudo}</div>
                    <button style="border:none; background:none; color:var(--cor-principal); font-weight:bold; cursor:pointer; margin-top:10px;" onclick="this.previousElementSibling.classList.toggle('aberto'); this.innerText = this.innerText === 'LER MAIS' ? 'LER MENOS' : 'LER MAIS';">LER MAIS</button>
                    <p style="margin-top:15px; font-size:0.8em; color:#777;">Autor: ${autorFinal}</p>
                `;
                container.appendChild(post);

                // LINK LATERAL DIRECIONADO PARA O ID DA NOTÍCIA
                const link = `<a href="#${noticiaID}">${n.titulo}</a>`;
                const t = n.tema ? n.tema.toLowerCase() : "";

                if (t.includes("anime") || t.includes("outono")) document.getElementById('feed-animes').innerHTML += link;
                else if (t.includes("netflix") || t.includes("cinema") || t.includes("marvel")) document.getElementById('feed-plataformas').innerHTML += link;
                else if (t.includes("nerd")) document.getElementById('feed-nerd').innerHTML += link;
                else document.getElementById('feed-antigas').innerHTML += link;
            });
        }

        window.onload = renderizar;
    </script>
</body>

</html>
